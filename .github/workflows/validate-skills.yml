name: 校验 Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 校验索引和 Skills
        run: ./scripts/skill validate
      - name: 测试 CLI
        run: python -m unittest discover -s tests -v
